name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.22.x'
          - '1.23.x'
          - '1.24.x'
          - '1.25.x'
          - '1.26.x'

    env:
      GOPRIVATE: github.com/justusschock/*
      GONOSUMDB: github.com/justusschock/*

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Configure private module access
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          test -n "$GO_MODULES_TOKEN"
          git config --global url."https://x-access-token:${GO_MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Verify module metadata
        run: go mod tidy -diff

      - name: List module graph
        run: go list -m all

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...
